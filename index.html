<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>The Road to the Demon King</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#181b22;
    --surface:#222630;
    --surface-2:#2b303c;
    --text:#e8e4d6;
    --muted:#9ba1ae;
    --accent:#c9a24b;
    --accent-ink:#181b22;
    --rust:#c0705a;
    --line:#3a404d;
    --focus:#e6c26a;
    --font-display:"Fraunces", Georgia, serif;
    --font-body:"Source Serif 4", Georgia, serif;
    --font-mono:ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    --radius:4px;
    color-scheme:dark;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#eceff3; --surface:#ffffff; --surface-2:#e3e7ee; --text:#1c2029; --muted:#586070;
      --accent:#8a6a1c; --accent-ink:#ffffff; --rust:#9c4430; --line:#c9cfd9; --focus:#8a6a1c;
      color-scheme:light;
    }
  }
  :root[data-theme="light"]{
    --bg:#eceff3; --surface:#ffffff; --surface-2:#e3e7ee; --text:#1c2029; --muted:#586070;
    --accent:#8a6a1c; --accent-ink:#ffffff; --rust:#9c4430; --line:#c9cfd9; --focus:#8a6a1c;
    color-scheme:light;
  }

  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html{scroll-padding-top:150px}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:var(--font-body); font-size:16px; line-height:1.6;
  }
  h1,h2,h3{font-family:var(--font-display); font-weight:650; margin:0; text-wrap:balance; letter-spacing:.2px}
  a{color:inherit}
  a:focus-visible, button:focus-visible, input:focus-visible{outline:2px solid var(--focus); outline-offset:2px}
  p{margin:0 0 10px}
  .sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}

  .masthead{
    position:sticky; top:env(safe-area-inset-top, 0px); z-index:10;
    background:var(--bg); border-bottom:1px solid var(--line);
    padding-inline:16px;
  }
  .mast-inner{max-width:720px; margin:0 auto}
  .mast-top{display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px; padding-block:12px 6px}
  .brand{display:flex; flex-direction:column; text-decoration:none; margin-right:auto; min-width:0}
  .brand .eyebrow{font-size:.7rem; letter-spacing:.14em; text-transform:uppercase; color:var(--rust)}
  .brand .name{font-family:var(--font-display); font-weight:650; font-size:1.2rem; line-height:1.15}
  .search{flex:1 1 200px; min-width:0}
  .search input, .dmpanel input{
    width:100%; background:var(--surface); color:var(--text); border:1px solid var(--line);
    border-radius:var(--radius); padding:9px 12px; font:inherit; font-size:.92rem;
  }
  .search input::placeholder, .dmpanel input::placeholder{color:var(--muted)}
  .dmbtn, .btn{
    font:inherit; font-size:.82rem; color:var(--accent); background:transparent; cursor:pointer;
    border:1px solid var(--accent); border-radius:999px; padding:6px 14px; white-space:nowrap;
  }
  .dmbtn:hover, .btn:hover{background:var(--accent); color:var(--accent-ink)}
  .dmbtn[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink)}
  .dmpanel{padding-block:4px 12px}
  .dmpanel form{display:flex; flex-wrap:wrap; gap:8px}
  .dmpanel input{flex:1 1 200px; width:auto; min-width:0}
  .dmmsg{margin:6px 0 0; font-size:.85rem; color:var(--rust); min-height:1.2em}
  .typenav{display:flex; overflow-x:auto; gap:0; margin-inline:-4px}
  .typenav a{
    color:var(--muted); text-decoration:none; font-size:.85rem; white-space:nowrap;
    padding:9px 11px 10px; border-bottom:2px solid transparent;
  }
  .typenav a:hover{color:var(--accent)}
  .typenav a.on{color:var(--accent); border-bottom-color:var(--accent)}

  main{max-width:720px; margin:0 auto; padding-inline:16px; padding-block:26px 70px}
  .view > * + *{margin-top:34px}
  .intro{color:var(--muted); max-width:56ch; margin:0}
  .sec-head{display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; border-bottom:1px solid var(--line); margin-bottom:14px; padding-bottom:8px}
  .sec-head h2{font-size:1.2rem; color:var(--accent)}
  .more{font-size:.82rem; color:var(--accent)}
  .page-h{font-size:1.9rem}

  .filters{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px}
  .filters button{
    font:inherit; font-size:.82rem; color:var(--muted); background:transparent;
    border:1px solid var(--line); border-radius:999px; padding:4px 13px; cursor:pointer;
  }
  .filters button:hover{color:var(--text); border-color:var(--muted)}
  .filters button[aria-pressed="true"]{color:var(--accent-ink); background:var(--accent); border-color:var(--accent)}

  .cards{display:grid; gap:10px}
  .card{
    display:block; text-decoration:none; background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius); padding:13px 15px;
  }
  a.card:hover{border-color:var(--accent)}
  .card-top{display:flex; align-items:baseline; gap:8px 10px; flex-wrap:wrap}
  .card h3{font-size:1.05rem; margin-right:auto; min-width:0}
  .card p{color:var(--muted); font-size:.92rem; margin:6px 0 0}
  .typelabel{font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--rust)}
  .pill{font-size:.7rem; color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:2px 9px; white-space:nowrap}
  .pill.on{color:var(--accent); border-color:var(--accent)}
  .dmtag{font-size:.65rem; letter-spacing:.1em; text-transform:uppercase; color:var(--rust); border:1px solid var(--rust); border-radius:999px; padding:1px 8px; white-space:nowrap}
  .empty{color:var(--muted); border:1px dashed var(--line); border-radius:var(--radius); padding:16px; margin:0}

  .events{list-style:none; margin:0; padding:0; display:grid; gap:10px}
  .events li{display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 10px}
  .events .txt{flex:1 1 260px; min-width:0}
  .part{font-size:.78rem; color:var(--accent); flex:0 0 auto; font-variant-numeric:tabular-nums}
  .tag{flex:0 0 auto; font-size:.68rem; border-radius:999px; padding:2px 9px; white-space:nowrap}
  .tag.party{color:var(--muted); border:1px solid var(--line)}
  .tag.player{color:var(--accent); border:1px solid var(--accent)}
  .chip{
    flex:0 0 auto; font-size:.72rem; color:var(--accent); border:1px solid var(--accent);
    border-radius:999px; padding:2px 10px; text-decoration:none; white-space:nowrap;
  }
  .chip:hover{background:var(--accent); color:var(--accent-ink)}
  .chips{display:flex; flex-wrap:wrap; gap:7px}
  a.ref{color:var(--accent); text-decoration:underline; text-decoration-style:dotted; text-underline-offset:3px}
  a.ref:hover{text-decoration-style:solid}

  .browse{display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:10px}
  .browse a{display:flex; justify-content:space-between; align-items:baseline; gap:8px; text-decoration:none; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:10px 13px}
  .browse a:hover{border-color:var(--accent)}
  .browse .n{color:var(--muted); font-size:.85rem; font-variant-numeric:tabular-nums}

  .crumb{font-size:.8rem; color:var(--muted); margin-bottom:8px}
  .crumb a{color:var(--rust); text-decoration:none}
  .crumb a:hover{text-decoration:underline}
  .entry-title{display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px}
  .entry-title h1{font-size:1.9rem; line-height:1.15; margin-right:auto; min-width:0}
  .sub{color:var(--muted); margin:6px 0 0; font-size:.95rem}
  .lead{font-size:1.05rem; margin:0}
  .block h3{font-size:1rem; color:var(--text); margin-bottom:6px; display:flex; align-items:center; gap:10px; flex-wrap:wrap}
  .block ul{margin:0; padding-left:1.2em}
  .block li{margin-bottom:5px}
  .block.dm{border-left:3px dashed var(--rust); padding-left:13px}
  .label{font-size:.7rem; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-bottom:8px}
  .homebrew{font-size:.7rem; color:var(--rust); border:1px solid var(--rust); border-radius:999px; padding:1px 9px}
  .pending{color:var(--muted); font-size:.88rem; margin:10px 0 0}

  .stat{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px 16px; font-family:var(--font-mono); font-size:.86rem; line-height:1.5;
  }
  .stat.pc{border-left:3px solid var(--accent)}
  .stat .core{border-block:1px solid var(--line); padding-block:8px; margin-block:0 8px}
  .stat .abil{color:var(--muted); margin-bottom:8px; overflow-wrap:anywhere}
  .stat p{margin:6px 0}
  .stat b{font-weight:600}

  .result-snippet{color:var(--muted); font-size:.9rem}
  footer{max-width:720px; margin:0 auto; padding:0 16px 40px; color:var(--muted); font-size:.8rem; text-align:center}
  @media (max-width:420px){ .entry-title h1{font-size:1.55rem} .page-h{font-size:1.6rem} }
</style>

<header class="masthead">
  <div class="mast-inner">
    <div class="mast-top">
      <a class="brand" href="#home"><span class="eyebrow">Campaign wiki</span><span class="name">The Road to the Demon King</span></a>
      <div class="search"><input id="q" type="search" placeholder="Search the wiki" aria-label="Search the wiki" autocomplete="off"></div>

      </form>
      <p class="dmmsg" id="dmmsg" role="status"></p>
    </div>
    <nav class="typenav" id="typenav" aria-label="Browse by type"></nav>
  </div>
</header>

  {id:'ev6', who:'Party', quest:'quest-goblin', text:'Followed the lead provided by the two strangers to reach the camp.'},
  {id:'ev7', who:'Party', quest:'quest-goblin', text:'Reached level 2 after defeating the goblin boss.'},
  {id:'ev8', who:'Piama', quest:'quest-merchant', text:'A Charisma check to collect the reward failed. A fight broke out with the merchant and no reward was paid. This is recorded separately from the initial wagon encounter.'}
];

var ENTRIES = [], ENT = {}, BACK = {}, dmOn = false;
var viewEl = document.getElementById('view');
var qEl = document.getElementById('q');
var qFilter = 'active';

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function refLink(id){ var e = ENT[id]; return e ? '<a class="ref" href="#'+id+'">'+esc(e.title)+'</a>' : ''; }
function rt(s){ return esc(s).replace(/\[\[([a-z0-9-]+)\]\]/g, function(m,id){ return refLink(id); }); }
function plain(s){ return String(s).replace(/\[\[([a-z0-9-]+)\]\]/g, function(m,id){ return ENT[id] ? ENT[id].title : ''; }); }
function refsIn(s){ var out=[], re=/\[\[([a-z0-9-]+)\]\]/g, m; while((m=re.exec(s))){ if(ENT[m[1]] && out.indexOf(m[1])<0) out.push(m[1]); } return out; }

function entryText(e){
  var t = [e.title, e.sub||'', e.summary||'', e.tag||'', e.note||''];
  (e.sections||[]).forEach(function(s){ t.push(s.h); (s.p||[]).forEach(function(x){t.push(x)}); (s.ul||[]).forEach(function(x){t.push(x)}); });
  if(e.stat){ t.push(e.stat.core, e.stat.abil); e.stat.groups.forEach(function(g){ g.forEach(function(x){ t.push((x.n||'')+' '+x.t); }); }); }
  return t.join(' ');
}
function entryRefs(e){
  var out=[]; function add(a){ a.forEach(function(id){ if(id!==e.id && out.indexOf(id)<0) out.push(id); }); }
  add(refsIn(e.summary||''));
  (e.sections||[]).forEach(function(s){ (s.p||[]).forEach(function(x){add(refsIn(x))}); (s.ul||[]).forEach(function(x){add(refsIn(x))}); });
  return out;
}
function eventsFor(id){ return EVENTS.filter(function(v){ return v.quest===id || refsIn(v.text).indexOf(id)>=0; }); }

function rebuild(dm){
  var list = JSON.parse(JSON.stringify(PUBLIC));
  if(dm){
    list.forEach(function(e){
      var x = dm.extra[e.id]; if(!x) return;
      (x.sections||[]).forEach(function(s){ s.dm = true; e.sections = (e.sections||[]).concat([s]); });
      if(x.stat){ e.stat = x.stat; e.dmStat = true; }
    });
    dm.entries.forEach(function(e){ e.dmOnly = true; list.push(e); });
  }
  ENTRIES = list; ENT = {}; BACK = {};
  list.forEach(function(e){ ENT[e.id] = e; });
  list.forEach(function(e){ entryRefs(e).forEach(function(id){ (BACK[id] = BACK[id]||[]); if(BACK[id].indexOf(e.id)<0) BACK[id].push(e.id); }); });
}

function statusPill(e){
  if(!e.status) return '';
  var on = (e.status==='Active' || e.status==='Upcoming');
  return '<span class="pill'+(on?' on':'')+'">'+esc(e.status)+'</span>';
}
function whoTag(w){ return '<span class="tag '+(w==='Party'?'party':'player')+'">'+esc(w)+'</span>'; }
function stripLinks(h){ return h.replace(/<a [^>]*>([^<]*)<\/a>/g,'$1'); }

function card(e){
  var d = e.summary || e.sub || '';
  return '<a class="card" href="#'+e.id+'"><div class="card-top"><h3>'+esc(e.title)+'</h3>'+(e.dmOnly?'<span class="dmtag">DM only</span>':'')+statusPill(e)+'</div>'
    + (d ? '<p>'+stripLinks(rt(d))+'</p>' : '') + '</a>';
}
function cardWithType(e){
  var d = e.summary || e.sub || '';
  return '<a class="card" href="#'+e.id+'"><div class="card-top"><span class="typelabel">'+TYPES[e.type].one+'</span><h3>'+esc(e.title)+'</h3>'+(e.dmOnly?'<span class="dmtag">DM only</span>':'')+statusPill(e)+'</div>'
    + (d ? '<p>'+stripLinks(rt(d))+'</p>' : '') + '</a>';
}
function eventsList(list, opts){
  opts = opts||{};
  if(!list.length) return '<p class="empty">Nothing logged yet.</p>';
  return '<ul class="events">' + list.map(function(v, i){
    return '<li>'
      + (opts.parts ? '<span class="part">Part '+(i+1)+'</span>' : '')
      + whoTag(v.who)
      + '<span class="txt">'+rt(v.text)+'</span>'
      + (!opts.parts && v.quest && ENT[v.quest] ? '<a class="chip" href="#'+v.quest+'">'+esc(ENT[v.quest].title)+'</a>' : '')
      + '</li>';
  }).join('') + '</ul>';
}

function questFilterBlock(){
  var quests = ENTRIES.filter(function(e){ return e.type==='quest'; });
  var active = quests.filter(function(e){ return e.status==='Active'; });
  var resolved = quests.filter(function(e){ return e.status==='Resolved'; });
  var shown = qFilter==='active' ? active : qFilter==='resolved' ? resolved : quests;
  function btn(key,label,n){ return '<button type="button" data-filter="'+key+'" aria-pressed="'+(qFilter===key)+'">'+label+' ('+n+')</button>'; }
  var body = shown.length ? '<div class="cards">'+shown.map(card).join('')+'</div>'
    : '<p class="empty">No '+(qFilter==='resolved'?'resolved':'active')+' quests right now. Finished quests move to Resolved and stay searchable.</p>';
  return '<div class="filters">'+btn('active','Active',active.length)+btn('resolved','Resolved',resolved.length)+btn('all','All',quests.length)+'</div>'+body;
}

function typesWithEntries(){
  return Object.keys(TYPES).filter(function(k){ return ENTRIES.some(function(e){ return e.type===k; }); });
}

function renderHome(){
  var upcoming = ENTRIES.filter(function(e){ return e.type==='encounter' && e.status==='Upcoming'; });
  var recent = EVENTS.slice().reverse().slice(0,5);
  var browse = typesWithEntries().map(function(k){
    var n = ENTRIES.filter(function(e){ return e.type===k; }).length;
    return '<a href="#'+TYPES[k].list+'"><span>'+TYPES[k].label+'</span><span class="n">'+n+'</span></a>';
  }).join('') + '<a href="#list-history"><span>History</span><span class="n">'+EVENTS.length+'</span></a>';
  return '<p class="intro">Everything the party knows so far. Search, browse by type, or follow the links between entries.</p>'
    + '<section><div class="sec-head"><h2>Quests</h2><a class="more" href="#list-quests">All quests</a></div><div id="quest-block">'+questFilterBlock()+'</div></section>'
    + (upcoming.length ? '<section><div class="sec-head"><h2>Coming up</h2><a class="more" href="#list-encounters">All encounters</a></div><div class="cards">'+upcoming.map(card).join('')+'</div></section>' : '')
    + '<section><div class="sec-head"><h2>Recent history</h2><a class="more" href="#list-history">Full history</a></div>'+eventsList(recent)+'</section>'
    + '<section><div class="sec-head"><h2>Browse</h2></div><div class="browse">'+browse+'</div></section>';
}

function renderList(typeKey){
  var t = TYPES[typeKey];
  var items = ENTRIES.filter(function(e){ return e.type===typeKey; });
  var html = '<div><h1 class="page-h">'+t.label+'</h1></div>';
  if(typeKey==='quest') html += '<div id="quest-block">'+questFilterBlock()+'</div>';
  else html += items.length ? '<div class="cards">'+items.map(card).join('')+'</div>' : '<p class="empty">Nothing here yet.</p>';
  return html;
}
function renderHistory(){
  return '<div><h1 class="page-h">History</h1><p class="sub">Everything that has happened, oldest first. Each line links to its quest.</p></div>' + eventsList(EVENTS);
}

function statHtml(s){
  var h = '<div class="stat'+(s.pc?' pc':'')+'"><div class="core">'+esc(s.core)+'</div><div class="abil">'+esc(s.abil)+'</div>';
  s.groups.forEach(function(g){
    h += '<p>' + g.map(function(x){ return x.n ? '<b>'+esc(x.n)+'.</b> '+rt(x.t) : rt(x.t); }).join('<br>') + '</p>';
  });
  return h + '</div>';
}
function chips(ids){ return '<div class="chips">'+ids.map(function(id){ return '<a class="chip" href="#'+id+'">'+esc(ENT[id].title)+'</a>'; }).join('')+'</div>'; }

function renderEntry(e){
  var t = TYPES[e.type];
  var h = '<div><div class="crumb"><a href="#'+t.list+'">'+t.label+'</a></div>'
    + '<div class="entry-title"><h1>'+esc(e.title)+'</h1>'+(e.tag?'<span class="homebrew">'+esc(e.tag)+'</span>':'')+(e.dmOnly?'<span class="dmtag">DM only</span>':'')+statusPill(e)+'</div>'
    + (e.sub ? '<p class="sub">'+esc(e.sub)+'</p>' : '') + '</div>';
  if(e.summary) h += '<p class="lead">'+rt(e.summary)+'</p>';
  if(e.stat){
    if(e.dmStat) h += '<section class="block dm"><h3>Stat block <span class="dmtag">DM only</span></h3>'+statHtml(e.stat)+'</section>';
    else h += '<div>'+statHtml(e.stat)+(e.note?'<p class="pending">'+esc(e.note)+'</p>':'')+'</div>';
  }
  if(e.type==='quest'){
    h += '<section class="block"><h3>Timeline</h3>'+eventsList(EVENTS.filter(function(v){ return v.quest===e.id; }), {parts:true})+'</section>';
  }
  (e.sections||[]).forEach(function(s){
    var dmMark = s.dm && !e.dmOnly;
    h += '<section class="block'+(dmMark?' dm':'')+'"><h3>'+esc(s.h)+(dmMark?' <span class="dmtag">DM only</span>':'')+'</h3>'
      + (s.p||[]).map(function(x){ return '<p>'+rt(x)+'</p>'; }).join('')
      + (s.ul ? '<ul>'+s.ul.map(function(x){ return '<li>'+rt(x)+'</li>'; }).join('')+'</ul>' : '') + '</section>';
  });
  if(e.type!=='quest'){
    var evs = eventsFor(e.id);
    if(evs.length) h += '<section class="block"><h3>In the history</h3>'+eventsList(evs)+'</section>';
  }
  var out = entryRefs(e), back = BACK[e.id]||[];
  if(out.length) h += '<section><div class="label">Links to</div>'+chips(out)+'</section>';
  if(back.length) h += '<section><div class="label">Linked from</div>'+chips(back)+'</section>';
  return h;
}

function renderSearch(raw){
  var toks = raw.toLowerCase().split(/\s+/).filter(Boolean);
  var res = [];
  ENTRIES.forEach(function(e){
    var hay = plain(entryText(e)).toLowerCase();
    if(toks.every(function(w){ return hay.indexOf(w)>=0; })){
      var inTitle = toks.every(function(w){ return e.title.toLowerCase().indexOf(w)>=0; });
      res.push({score:inTitle?0:1, html:cardWithType(e)});
    }
  });
  EVENTS.forEach(function(v){
    var hay = plain(v.text+' '+v.who).toLowerCase();
    if(toks.every(function(w){ return hay.indexOf(w)>=0; })){
      res.push({score:2, html:'<div class="card"><div class="card-top"><span class="typelabel">History</span>'+whoTag(v.who)+'</div><p class="result-snippet">'+rt(v.text)+'</p></div>'});
    }
  });
  res.sort(function(a,b){ return a.score-b.score; });
  return '<div><h1 class="page-h">Search</h1><p class="sub">'+res.length+(res.length===1?' result':' results')+' for “'+esc(raw)+'”</p></div>'
    + (res.length ? '<div class="cards">'+res.map(function(r){ return r.html; }).join('')+'</div>' : '<p class="empty">Nothing matches. Try a name, a place, or a single word.</p>');
}

function setNav(h){
  var items = [{id:'home',label:'Home'}].concat(typesWithEntries().map(function(k){ return {id:TYPES[k].list,label:TYPES[k].label}; })).concat([{id:'list-history',label:'History'}]);
  var active = h;
  if(ENT[h]) active = TYPES[ENT[h].type].list;
  document.getElementById('typenav').innerHTML = items.map(function(i){
    return '<a href="#'+i.id+'"'+(i.id===active?' class="on" aria-current="page"':'')+'>'+i.label+'</a>';
  }).join('');
}

function route(){
  var h = (location.hash||'').replace(/^#/,'') || 'home';
  var html;
  if(h==='home') html = renderHome();
  else if(h==='list-history') html = renderHistory();
  else if(h.indexOf('list-')===0){
    var key = Object.keys(TYPES).filter(function(k){ return TYPES[k].list===h; })[0];
    html = (key && ENTRIES.some(function(e){ return e.type===key; })) ? renderList(key) : '<div><h1 class="page-h">Not available</h1><p class="sub">That page isn’t available. <a class="ref" href="#home">Back to home</a></p></div>';
  }
  else if(ENT[h]) html = renderEntry(ENT[h]);
  else html = '<div><h1 class="page-h">Not available</h1><p class="sub">That page isn’t available. <a class="ref" href="#home">Back to home</a></p></div>';
  viewEl.innerHTML = html;
  setNav(h);
}

function showSearch(){
  var v = qEl.value.trim();
  if(!v){ route(); return; }
  viewEl.innerHTML = renderSearch(v);
  setNav('');
}
function refresh(){ if(qEl.value.trim()) showSearch(); else route(); }

var dmBtn = document.getElementById('dmbtn'), dmPanel = document.getElementById('dmpanel');
var dmForm = document.getElementById('dmform'), dmPw = document.getElementById('dmpw'), dmMsg = document.getElementById('dmmsg'), dmGo = document.getElementById('dmgo');

function b64(s){ return Uint8Array.from(atob(s), function(c){ return c.charCodeAt(0); }); }
async function decryptDM(pw){
  var km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  var key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(PAYLOAD.salt), iterations:PAYLOAD.iter, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['decrypt']);
  var pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(PAYLOAD.iv)}, key, b64(PAYLOAD.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
function setDmUi(){
  dmBtn.textContent = dmOn ? 'DM view on · Lock' : 'DM';
  dmBtn.setAttribute('aria-pressed', String(dmOn));
}
function lockDM(){
  dmOn = false; rebuild(null); setDmUi();
  if(!ENT[(location.hash||'').replace(/^#/,'')] && /^#(list-(notes))$/.test(location.hash||'')) location.hash = '#home';
  refresh();
}
dmBtn.addEventListener('click', function(){
  if(dmOn){ lockDM(); return; }
  dmPanel.hidden = !dmPanel.hidden;
  dmBtn.setAttribute('aria-expanded', String(!dmPanel.hidden));
  dmMsg.textContent = '';
  if(!dmPanel.hidden) dmPw.focus();
});
dmForm.addEventListener('submit', async function(ev){
  ev.preventDefault();
  var pw = dmPw.value.trim();
  if(!pw){ dmMsg.textContent = 'Enter the DM password.'; return; }
  if(!window.crypto || !crypto.subtle){ dmMsg.textContent = 'This browser cannot unlock the DM section here. Use a current Chrome, Edge, Firefox or Safari.'; return; }
  dmGo.disabled = true; dmMsg.textContent = 'Unlocking…';
  try{
    var data = await decryptDM(pw);
    dmOn = true; rebuild(data); setDmUi();
    dmPanel.hidden = true; dmBtn.setAttribute('aria-expanded','false');
    dmPw.value = ''; dmMsg.textContent = '';
    refresh();
  }catch(err){
    dmMsg.textContent = 'Wrong password.';
  }
  dmGo.disabled = false;
});

viewEl.addEventListener('click', function(ev){
  var b = ev.target.closest('button[data-filter]');
  if(b){ qFilter = b.getAttribute('data-filter'); var blk = document.getElementById('quest-block'); if(blk) blk.innerHTML = questFilterBlock(); }
});
qEl.addEventListener('input', showSearch);
window.addEventListener('hashchange', function(){ qEl.value=''; route(); window.scrollTo(0,0); });

rebuild(null);
setDmUi();
route();
</script>
</body></html>
